<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Expense Tracker</title>
  </head>
  <body>
    <main>
      <h1>Expense Tracker</h1>
      {% if created %}
      <p role="status">Expense added successfully.</p>
      {% endif %}
      {% if error %}
      <p role="alert">{{ error }}</p>
      {% endif %}
      <section aria-labelledby="add-expense-heading">
        <h2 id="add-expense-heading">Add an expense</h2>
        <form action="/" method="post">
          <p>
            <label for="amount">Amount ($)</label>
            <input id="amount" name="amount" type="number" min="0.01" step="0.01"
                   value="{{ form.amount }}" required>
          </p>
          <p>
            <label for="category">Category</label>
            <input id="category" name="category" type="text"
                   value="{{ form.category }}" required>
          </p>
          <p>
            <label for="date">Date</label>
            <input id="date" name="date" type="date" value="{{ form.date }}">
          </p>
          <p>
            <label for="note">Note (optional)</label>
            <input id="note" name="note" type="text" value="{{ form.note }}">
          </p>
          <button type="submit">Add expense</button>
        </form>
      </section>
    </main>
  </body>
</html>
